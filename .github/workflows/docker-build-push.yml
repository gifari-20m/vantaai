name: Build and Push RunPod Serverless Image

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'runpod-serverless-worker/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./runpod-serverless-worker
          file: ./runpod-serverless-worker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/wan22-serverless:latest
            ghcr.io/${{ github.repository }}/wan22-serverless:${{ github.sha }}
